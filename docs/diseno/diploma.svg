<text x="400" y="192" text-anchor="middle" font-family="Spectral, Georgia, serif" font-style="italic" font-size="18" fill="#2a1a0c">Se certifica que</text>
<text id="diploma-nombre" x="400" y="230" text-anchor="middle" font-family="Rye, serif" font-size="26" fill="#2a1a0c">el Humano de esta Casa</text>
<line x1="220" y1="243" x2="580" y2="243" stroke="#2a1a0c" stroke-width="2" stroke-linecap="round"></line>
<text x="400" y="278" text-anchor="middle" font-family="Spectral, Georgia, serif" font-size="18" fill="#2a1a0c">exorcizó con éxito a su fantasma doméstico</text>
<text id="diploma-reclamos" x="400" y="304" text-anchor="middle" font-family="Spectral, Georgia, serif" font-size="18" fill="#2a1a0c">tras presentar 3 reclamos</text>
<text x="400" y="330" text-anchor="middle" font-family="Spectral, Georgia, serif" font-size="18" fill="#2a1a0c">y queda habilitado para discutir con el más allá.</text>
<text x="112" y="388" font-family="Spectral, Georgia, serif" font-size="14" fill="#2a1a0c">Dado el <tspan id="diploma-fecha">12/11/2026</tspan> · Acta N.º <tspan id="diploma-acta">666-0000</tspan></text>
<line x1="112" y1="424" x2="360" y2="424" stroke="#2a1a0c" stroke-width="2" stroke-linecap="round"></line>
